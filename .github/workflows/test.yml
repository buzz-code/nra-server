name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Tests assume the consumer layout (<app>/server/shared); some resolve paths from it
      - uses: actions/checkout@v4
        with:
          path: server/shared
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: server/shared/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: server/shared
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: yarn test
        working-directory: server/shared
